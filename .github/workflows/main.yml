name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Plugins
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson --stacktrace

      - name: Checkout or Create Builds Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          BUILDS_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          if git ls-remote --exit-code --heads "$BUILDS_URL" builds >/dev/null 2>&1; then
            echo "builds branch exists."
            git clone --branch builds --single-branch "$BUILDS_URL" builds
          else
            echo "builds branch does not exist."
            mkdir -p builds
            cd builds

            git init
            git config user.email "actions@github.com"
            git config user.name "GitHub Actions"
            git remote add origin "$BUILDS_URL"

            git checkout --orphan builds

            touch .gitkeep
            git add .gitkeep
            git commit -m "Initialize builds branch"
            git push origin builds

            cd ..
          fi

      - name: Prepare Repository Files
        run: |
          set -e

          cp build/plugins.json builds/plugins.json

          cat > builds/repo.json <<'EOF'
          {
            "name": "sagemoon1996 CloudStream Repository",
            "description": "CloudStream plugins by sagemoon1996",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/sagemoon1996/cloudstream-repo/builds/plugins.json"
            ]
          }
          EOF

          find . -type f -name "*.cs3" \
            -not -path "./builds/*" \
            -exec cp {} builds/ \;

      - name: Push Builds
        working-directory: builds
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          git add .

          if ! git diff --cached --quiet; then
            git commit -m "Build $GITHUB_SHA"
            git push origin HEAD:builds
          else
            echo "No changes to push"
          fi
